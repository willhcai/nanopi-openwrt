name: Temporary Whisper VAD model package

on:
  push:
    branches:
      - tmp-whisper-model-20260810
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public VAD model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            --output ggml-silero-v6.2.0.bin \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin?download=true'
          test -s ggml-silero-v6.2.0.bin
          sha256sum ggml-silero-v6.2.0.bin | tee ggml-silero-v6.2.0.bin.sha256

      - name: Upload VAD artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-silero-vad-v6.2.0
          path: |
            ggml-silero-v6.2.0.bin
            ggml-silero-v6.2.0.bin.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
