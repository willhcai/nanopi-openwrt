name: Temporary Whisper base model package

on:
  push:
    branches:
      - tmp-whisper-model-20260810
  workflow_dispatch:

permissions:
  contents: read

env:
  MODEL_FILE: ggml-base-q5_1.bin
  MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --output "$MODEL_FILE" "$MODEL_URL"
          test -s "$MODEL_FILE"
          ls -lh "$MODEL_FILE"
          sha256sum "$MODEL_FILE" | tee "$MODEL_FILE.sha256"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: |
            ${{ env.MODEL_FILE }}
            ${{ env.MODEL_FILE }}.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
